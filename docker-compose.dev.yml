# Local development only. Publishes PostgreSQL on the loopback interface so
# the app can run from the host (./mvnw spring-boot:run). Never use this file
# on the VM, and never bind to 0.0.0.0.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
