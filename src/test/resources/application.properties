# Test stubs for properties that lack safe defaults in application.yaml.
# These allow @SpringBootTest context to start in the Testcontainers environment
# without requiring a real Vault, OCI, or Resend API key.
# DB_USERNAME/DB_PASSWORD are overridden per-test via @DynamicPropertySource.
DB_USERNAME=test
DB_PASSWORD=test
VAULT_ROLE_ID=test-role-id
VAULT_SECRET_ID=test-secret-id
OCI_OBJECT_STORAGE_NAMESPACE=test-namespace
RESEND_API_KEY=test-key
# Direct Spring property (resolved from YAML application.app-base-url: ${APP_BASE_URL:default})
application.app-base-url=http://localhost:8080
