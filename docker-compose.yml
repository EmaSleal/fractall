# This compose is the one Dokploy deploys on the VM (see P-014), so it must
# stay safe to run on a public host: PostgreSQL publishes no ports and takes
# its credentials from the environment. For local development, add
# docker-compose.dev.yml, which publishes PostgreSQL on 127.0.0.1 only:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      - POSTGRES_DB=facturacion
      # Same credentials the app uses, so there is a single pair to manage.
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    user: "0"
    cap_add:
      - IPC_LOCK
    # The image entrypoint already passes -config=/vault/config.
    command: server
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/vault/gcp-credenciales.json
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - vault_data:/vault/data
      - ../files/vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ../files/gcp-kms-credenciales.json:/vault/gcp-credenciales.json:ro

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"   # nunca 0.0.0.0 — ver más abajo
    environment:
      - SPRING_PROFILES_ACTIVE=produccion
      - DB_HOST=postgres
      - DB_USERNAME
      - DB_PASSWORD
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID
      - VAULT_SECRET_ID
      - HACIENDA_OAUTH_CLIENT_ID
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - FRONTEND_BASE_URL
      - OCI_OBJECT_STORAGE_NAMESPACE
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0
    networks:
      - red_interna
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

volumes:
  postgres_data:
  vault_data:
  
networks:
  red_interna:
